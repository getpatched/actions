name: Package CI

on:
  workflow_call:
    inputs:
      tooling_ref:
        description: Immutable getpatched/actions commit containing the build scripts
        required: true
        type: string
      drift:
        description: Query current signed distribution indexes instead of building
        default: false
        type: boolean

      paired_scan:
        description: Compare passive OS vulnerability scans of the exact installed baseline and candidate
        type: boolean
        default: false

      recipe_ref:
        description: Full branch ref to monitor in drift mode
        type: string

permissions:
  contents: read

jobs:
  recipe:
    name: Recipe validation
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      recipe_commit: ${{ steps.recipe_commit.outputs.sha }}
    steps:
      - name: Validate tooling ref
        env:
          TOOLING_REF: ${{ inputs.tooling_ref }}
        run: '[[ "$TOOLING_REF" =~ ^[0-9a-f]{40}$ ]]'
      - name: Validate monitored branch
        env:
          RECIPE_REF: ${{ inputs.recipe_ref }}
          DRIFT: ${{ inputs.drift }}
        run: |
          if [[ -n "$RECIPE_REF" ]]; then
            [[ "$DRIFT" == true && "$RECIPE_REF" == refs/heads/* ]] || exit 1
            git check-ref-format "$RECIPE_REF"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.recipe_ref }}
          path: recipe
          persist-credentials: false
      - name: Record recipe revision
        id: recipe_commit
        run: |
          sha=$(git -C recipe rev-parse --verify HEAD)
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: getpatched/actions
          ref: ${{ inputs.tooling_ref }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: getpatched/platform
          ref: c035cb19bd94a167cb58a57c80bb8f7a1b422409
          path: platform
          persist-credentials: false
      - id: matrix
        name: Validate recipe and resolve targets
        run: python3 tooling/scripts/recipe_ci.py --platform platform --recipe recipe --repository "$GITHUB_REPOSITORY"

  build:
    name: Build and test (${{ matrix.target }})
    needs: recipe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.recipe.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.recipe.outputs.recipe_commit }}
          path: recipe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: getpatched/actions
          ref: ${{ inputs.tooling_ref }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: getpatched/platform
          ref: c035cb19bd94a167cb58a57c80bb8f7a1b422409
          path: platform
          persist-credentials: false
      - name: Resolve validated build inputs
        env:
          TARGET: ${{ matrix.target }}
        run: python3 tooling/scripts/recipe_ci.py --platform platform --recipe recipe --repository "$GITHUB_REPOSITORY" --target "$TARGET" > "$RUNNER_TEMP/policy.json"
      - name: Build, test and install
        if: ${{ !inputs.drift }}
        env:
          PAIRED_SCAN: ${{ inputs.paired_scan }}
        run: |
          flags=()
          if [[ "$PAIRED_SCAN" == true ]]; then flags+=(--paired-scan); fi
          python3 tooling/scripts/build_ci.py --platform platform --recipe recipe --policy "$RUNNER_TEMP/policy.json" --reports "$RUNNER_TEMP/package-reports" "${flags[@]}"
      - name: Upload test results
        continue-on-error: true
        if: ${{ !cancelled() && !inputs.drift }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-test-results-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/package-reports/upstream-junit.xml
            ${{ runner.temp }}/package-reports/autopkgtest-summary.txt
            ${{ runner.temp }}/package-reports/signed-apt.txt
            ${{ runner.temp }}/package-reports/compatibility.txt
            ${{ runner.temp }}/package-reports/vulnerability-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Check source and dependency drift
        if: ${{ inputs.drift }}
        run: python3 tooling/scripts/source_drift.py --platform platform --policy "$RUNNER_TEMP/policy.json"
      - name: Summarize build failure
        if: failure()
        env:
          TARGET: ${{ matrix.target }}
          DRIFT: ${{ inputs.drift }}
        run: |
          stage='checkout or build environment preparation'
          report="$RUNNER_TEMP/package-reports/stage"
          if [[ -f "$report" ]]; then
            case "$(cat "$report")" in
              patch) stage='patch application' ;;
              'build and distro tests') stage='build or distro tests' ;;
              'additional upstream tests') stage='additional upstream tests' ;;
              'source download and checksum verification'|'pinned build environment'|'start build container'|'binary selection'|'sign test APT repository'|'clean install dependency preparation'|'clean install'|'installed package smoke test'|'installed package compatibility'|'installed distro tests'|'paired vulnerability scans') stage="$(cat "$report")" ;;
            esac
          fi
          if [[ "$DRIFT" == true ]]; then stage='source drift check'; fi
          echo "::error title=Package CI failure::$GITHUB_REPOSITORY / $TARGET / $stage"
          printf 'Failed: %s / %s / %s\n' "$GITHUB_REPOSITORY" "$TARGET" "$stage" >> "$GITHUB_STEP_SUMMARY"

  result:
    name: Package CI
    if: always()
    needs: [recipe, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful validation and all target builds
        env:
          VALIDATION: ${{ needs.recipe.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          printf 'Recipe validation: %s\n\nTarget builds: %s\n' "$VALIDATION" "$BUILD" >> "$GITHUB_STEP_SUMMARY"
          [[ "$VALIDATION" == success && "$BUILD" == success ]]
