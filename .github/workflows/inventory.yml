name: Package inventory
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-inventory.txt
      - name: Inspect packaging metadata without executing recipes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/package_inventory.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: package-inventory
          path: package-inventory.json
          if-no-files-found: error
